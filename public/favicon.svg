    <path d="M2 18 C2 18 18 14 28 10 C34 8 38 10 38 14 C38 18 34 20 28 20 L20 20 L16 28 L12 28 L14 20 L8 20 L6 24 L2 24 Z"
          fill="white"/>
  </g>

  <!-- Motion trail dots -->
