  <body>
    <div id="root">
      <!-- Inline skeleton shown before JS loads -->
      <div id="inline-skeleton" style="min-height:100vh;background:#fafaf8;font-family:sans-serif;">
        <div style="position:fixed;top:0;left:0;right:0;height:80px;background:rgba(255,255,255,0.85);border-bottom:1px solid #f1f5f9;display:flex;align-items:center;padding:0 24px;justify-content:space-between;z-index:50;backdrop-filter:blur(12px);">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:40px;height:40px;background:#e2e8f0;border-radius:12px;"></div>
            <div style="width:144px;height:20px;background:#e2e8f0;border-radius:999px;"></div>
          </div>
          <div style="width:112px;height:40px;background:#e2e8f0;border-radius:16px;"></div>
        </div>
        <div style="padding:140px 24px 0;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;">
          <div>
            <div style="width:220px;height:32px;background:#e2e8f0;border-radius:999px;margin-bottom:24px;"></div>
            <div style="width:100%;height:56px;background:#e2e8f0;border-radius:16px;margin-bottom:12px;"></div>
            <div style="width:80%;height:56px;background:#e2e8f0;border-radius:16px;margin-bottom:24px;"></div>
            <div style="width:100%;height:16px;background:#f1f5f9;border-radius:999px;margin-bottom:8px;"></div>
            <div style="width:75%;height:16px;background:#f1f5f9;border-radius:999px;margin-bottom:32px;"></div>
            <div style="display:flex;gap:16px;">
              <div style="width:160px;height:56px;background:#e2e8f0;border-radius:16px;"></div>
              <div style="width:176px;height:56px;background:#e2e8f0;border-radius:16px;"></div>
            </div>
          </div>
          <div style="background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.06);">
            <div style="width:100%;height:240px;background:#e2e8f0;"></div>
            <div style="padding:24px;">
              <div style="width:60%;height:16px;background:#f1f5f9;border-radius:999px;margin-bottom:16px;"></div>
              <div style="display:flex;gap:8px;margin-bottom:16px;">
                <div style="width:80px;height:24px;background:#f1f5f9;border-radius:999px;"></div>
                <div style="width:96px;height:24px;background:#f1f5f9;border-radius:999px;"></div>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:1px solid #f8fafc;">
                <div style="width:96px;height:40px;background:#e2e8f0;border-radius:12px;"></div>
                <div style="width:128px;height:44px;background:#e2e8f0;border-radius:16px;"></div>
              </div>
            </div>
          </div>
        </div>
        <style>
          #inline-skeleton { animation: sk-pulse 1.5s ease-in-out infinite; }
          @keyframes sk-pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
          @media(max-width:768px){
            #inline-skeleton > div:last-child { grid-template-columns:1fr!important; }
            #inline-skeleton > div:last-child > div:last-child { display:none; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
